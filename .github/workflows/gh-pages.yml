# Backup deployment. Production is Vercel (renanbazinin.com); this mirrors every
# push to main onto https://renanbazinin.github.io/ as a fallback. The build
# prerenders one HTML file per route plus 404.html, so no SPA fallback is needed,
# and every page's canonical tag points at renanbazinin.com.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let an in-flight one finish
# rather than cancelling it half-deployed.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The user site must stay on renanbazinin.github.io: binding a custom domain
      # here would take every project site under /<repo>/ with it.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Refuse to deploy while a custom domain is bound
        run: test "${{ steps.pages.outputs.host }}" = "renanbazinin.github.io"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
