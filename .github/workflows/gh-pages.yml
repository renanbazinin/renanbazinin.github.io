# Backup deployment. Production is Vercel (www.renanbazinin.com); this mirrors
# every push to main onto https://renanbazinin.github.io/ as a fallback.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let an in-flight one finish
# rather than cancelling it half-deployed.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages has no rewrite rules, so the vercel.json catch-all to
      # /index.html has no equivalent here. Serving the app from 404.html makes
      # direct hits on client-side routes (/projects, /about) boot the router.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
